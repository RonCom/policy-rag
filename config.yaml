# ---- Corpus ---------------------------------------------------------------------
docs_dir: data/docs                # the CMS manual PDFs (see README for links)
data_dir: data
docs:                              # file name -> short citation label
  01-chapter1-ncci-medicare-policy-manual-2026-final.pdf: NCCI Ch. 1
  11-chapter11a-ncci-medicare-policy-manual-2026-final.pdf: NCCI Ch. 11
  bp102c15.pdf: Benefit Policy Manual Ch. 15
  clm104c05.pdf: Claims Processing Manual Ch. 5

chunk:
  max_words: 300                   # split long sections into pieces of about this size
  overlap_words: 40

# ---- Models (Ollama, local) ----------------------------------------------------------
ollama_url: http://localhost:11434
embed_model: nomic-embed-text
chat_model: gemma4:e4b             # answers (fits 8 GB VRAM)
judge_model: gemma4:26b            # grading: a larger model than the one being graded
temperature: 0

# ---- Retrieval and answering ----------------------------------------------------------
retrievers: [bm25, dense, hybrid, rerank]
top_k: 5
# retrieval test (2026-11-04): rerank_minus_hybrid recall@5 +0.02, CI [-0.04, +0.08] -> did not switch
# answer test (written before running): switch to rerank only if judged correctness on the 50 answerable
# questions rises with a paired bootstrap 95% CI above 0, with no more false declines and 12/12 out-of-scope declined
answer_retriever: hybrid
rerank:                            # cross-encoder over hybrid's top candidates (sentence-transformers, CPU is enough)
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  candidates: 20

# ---- Evaluation ---------------------------------------------------------------------------
eval_questions: eval/questions.jsonl
human_labels: eval/human_labels.csv

# ---- Retrieval sweep (policy-rag sweep; MLflow experiment "policy-rag-sweep") ------------------
sweep:
  grid: [[150, 30], [300, 0], [300, 40], [500, 60], [800, 80]]   # [max_words, overlap_words]
  max_context_words: 3000          # top-k excerpts must fit this budget (~4k tokens of an 8k window)
  rule: "max recall@5 within context budget; ties: plain recall@5, MRR; switch only if bootstrap CI > 0"

# ---- Monitoring (policy-rag monitor; Evidently + MLflow experiment "policy-rag-monitoring") -----
monitor:
  reference: eval/questions.jsonl  # what was measured: the evaluated question mix
  current: eval/traffic_sample.jsonl
  flag_quantile: 0.1               # "low confidence" = beyond the reference's 10th percentile on a signal
  min_flags: 2                     # review a query when at least this many signals are low
