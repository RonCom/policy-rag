[project]
name = "policy-rag"
version = "0.1.0"
description = "Question answering over CMS billing-policy manuals with local LLMs, cited answers, and a measured evaluation (retrieval metrics, LLM-as-a-judge calibrated against human labels)"
readme = "README.md"
authors = [{ name = "Chris Lavelle" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "matplotlib>=3.8",
    "mlflow>=2.16",
    "numpy>=1.26",
    "pandas>=2.2",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.scripts]
policy-rag = "policy_rag.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
